<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journaling Bible Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-app: #f4f4f9;
            --bg-paper: #fdfcf8;
            --ink-black: #1a1a1a;
            --ink-blue: #2b5797;
            --highlight-yellow: rgba(255, 235, 100, 0.6);
            --border-color: #ddd;
            --accent: #4a90e2;
            --scripture-size: 1.35rem;
            --page-pad: 80px;
            --foot-band: 130px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            margin: 0;
            display: flex;
            height: 100vh;
            color: #333;
        }

        /* ---------- Sidebar editor ---------- */
        #editor {
            width: 400px;
            flex: none;
            background: white;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        h1 { font-size: 1.1rem; margin: 0 0 18px; color: #555; border-bottom: 2px solid var(--bg-app); padding-bottom: 10px; }
        .section { margin-bottom: 22px; }
        .section-label { font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; display: block; color: #777; text-transform: uppercase; letter-spacing: .04em; }

        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea { resize: vertical; min-height: 160px; line-height: 1.5; }

        .note-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            position: relative;
        }
        .note-item .remove-btn {
            position: absolute; top: 8px; right: 8px;
            background: #ffeded; color: #d9534f; border: none;
            border-radius: 4px; cursor: pointer; font-size: 0.7rem; padding: 2px 6px;
        }
        .note-item textarea { min-height: 60px; margin-bottom: 8px; }
        .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .row label { font-size: 0.72rem; color: #888; white-space: nowrap; }
        .row select { flex: 1; padding: 4px 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.78rem; font-family: inherit; }
        .row input[type="range"] { flex: 1; }
        .mini-btn {
            background: #eee; color: #555; border: 1px solid #ddd;
            border-radius: 5px; cursor: pointer; font-size: 0.7rem;
            padding: 4px 8px; font-family: inherit; white-space: nowrap;
        }
        .mini-btn:hover { background: #e3e3e3; }

        .btn {
            padding: 10px 15px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; transition: opacity 0.2s;
            font-family: inherit; font-size: 0.85rem;
        }
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-bottom: 8px; }
        .btn-secondary { background: #eee; color: #555; width: 100%; }
        .btn:hover { opacity: 0.9; }

        #fit-status {
            font-size: 0.78rem; line-height: 1.4; padding: 9px 11px;
            border-radius: 6px; margin-top: 6px;
            background: #eef7ee; color: #2f7a3a; border: 1px solid #cfe6d2;
        }
        #fit-status.warn { background: #fdf3e6; color: #97621a; border-color: #f0dcbd; }

        /* ---------- Preview ---------- */
        #preview-pane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
            background-color: #e0e0e6;
        }

        /* The square page. flex:0 0 auto is load-bearing — without it the
           flex parent shrinks the page and the export stops being square. */
        #bible-page {
            flex: 0 0 auto;
            width: 1000px;
            height: 1000px;
            background-color: var(--bg-paper);
            padding: var(--page-pad);
            padding-bottom: var(--foot-band);
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: safe center;   /* centres when it fits, anchors top when it doesn't */
        }

        #page-body {
            display: flex;
            gap: 48px;
            width: 100%;
            align-items: flex-start;
        }

        #scripture-content {
            flex: 0 0 66%;
            max-width: 66%;
            font-family: 'EB Garamond', serif;
            font-size: var(--scripture-size);
            line-height: 1.58;
            color: var(--ink-black);
            text-align: left;
        }

        #scripture-content p { margin: 0 0 0.95em; }
        #scripture-content p:last-child { margin-bottom: 0; }

        #scripture-content mark {
            background-color: var(--highlight-yellow);
            color: inherit;
            padding: 1px 2px;
            border-radius: 2px;
        }

        #notes-content {
            flex: 1 1 auto;
            position: relative;
            align-self: stretch;
            min-height: 10px;
        }

        .handwritten-note {
            position: absolute;
            left: 0;
            width: 100%;
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            line-height: 1.15;
            color: var(--ink-blue);
            transform: rotate(-1deg);
            transform-origin: left top;
            pointer-events: none;
        }

        /* Footer: reference sits in its own reserved band so clipped text
           never runs through it. */
        #page-foot {
            position: absolute;
            left: var(--page-pad);
            right: var(--page-pad);
            bottom: 46px;
            text-align: center;
            font-family: 'EB Garamond', serif;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: .02em;
            color: #6a6a6a;
        }
        #page-foot::before {
            content: "";
            position: absolute;
            left: -20px; right: -20px; top: -70px; bottom: -46px;
            background: linear-gradient(to bottom, rgba(253,252,248,0) 0%, rgba(253,252,248,0.97) 42%, var(--bg-paper) 62%);
        }
        #page-foot span { position: relative; }

        /* Invisible marker the fit-check measures against */
        #content-limit {
            position: absolute;
            left: 0; right: 0;
            bottom: calc(var(--foot-band) - 8px);
            height: 0;
        }

        .hint { font-size: 0.72rem; color: #999; margin-bottom: 8px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="editor">
        <h1>Journaling Bible Generator</h1>

        <div class="section">
            <span class="section-label">Scripture</span>
            <div class="hint">Blank line = new paragraph. Wrap text in &lt;mark&gt;…&lt;/mark&gt; for the highlighter.</div>
            <textarea id="scripture-input">An argument arose among them concerning which one of them was the greatest. But Jesus, aware of their inner thoughts, took a little child and put it by his side and said to them, <mark>"Whoever welcomes this child in my name welcomes me, and whoever welcomes me welcomes the one who sent me, for the least among all of you is the greatest."</mark>

John answered, "Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us." But Jesus said to him, <mark>"Do not stop him, for whoever is not against you is for you."</mark>

When the days drew near for him to be taken up, he set his face to go to Jerusalem. And he sent messengers ahead of him. On their way they entered a village of the Samaritans to prepare for his arrival, but they did not receive him because his face was set toward Jerusalem. When his disciples James and John saw this, they said, <mark>"Lord, do you want us to command fire to come down from heaven and consume them?"</mark> But he turned and rebuked them. Then they went on to another village.</textarea>
            <input type="text" id="reference-input" placeholder="Reference (e.g. Luke 9:46-56)" value="Luke 9:46-56">
        </div>

        <div class="section">
            <span class="section-label">Page</span>
            <div class="row">
                <label>Text size</label>
                <input type="range" id="size-input" min="80" max="150" value="135">
                <label id="size-readout" style="width:34px;text-align:right">1.35</label>
            </div>
            <div class="row">
                <button class="mini-btn" onclick="fitToPage()">⤓ Fit to page</button>
                <button class="mini-btn" onclick="resetSize()">Reset</button>
            </div>
            <div id="fit-status">Fits.</div>
        </div>

        <div class="section">
            <span class="section-label">Marginal Notes</span>
            <div class="hint">Each note sits beside the paragraph it belongs to.</div>
            <div id="notes-list"></div>
            <button class="btn btn-secondary" onclick="addNote()">+ Add Note</button>
        </div>

        <div style="margin-top: auto; padding-top: 18px; border-top: 1px solid var(--border-color);">
            <button class="btn btn-primary" onclick="exportImage()">Download as PNG</button>
            <div class="hint" style="text-align:center; margin:0">1000 × 1000 px, exported at 3× (3000 × 3000).</div>
        </div>
    </div>

    <div id="preview-pane">
        <div id="bible-page">
            <div id="page-body">
                <div id="scripture-content"></div>
                <div id="notes-content"></div>
            </div>
            <div id="content-limit"></div>
            <div id="page-foot"><span id="page-reference"></span></div>
        </div>
    </div>

    <script>
        // Each note anchors to a paragraph index, with a pixel nudge.
        let notes = [
            { text: "Care for the children, orphan and widow. Welcome the immigrant.", para: 0, nudge: -6 },
            { text: "Just because they're not your flavour of christian doesn't mean they're not faithful.", para: 1, nudge: -6 },
            { text: "That's not very turn the other cheek, is it?", para: 2, nudge: 190 }
        ];

        const scriptureInput = document.getElementById('scripture-input');
        const referenceInput = document.getElementById('reference-input');
        const sizeInput      = document.getElementById('size-input');
        const sizeReadout    = document.getElementById('size-readout');
        const scriptureEl    = document.getElementById('scripture-content');
        const notesEl        = document.getElementById('notes-content');
        const notesList      = document.getElementById('notes-list');
        const pageEl         = document.getElementById('bible-page');
        const pageBodyEl     = document.getElementById('page-body');
        const pageRefEl      = document.getElementById('page-reference');
        const limitEl        = document.getElementById('content-limit');
        const fitStatus      = document.getElementById('fit-status');

        // Split the textarea into paragraphs on blank lines.
        function paragraphs() {
            return scriptureInput.value
                .split(/\n\s*\n/)
                .map(p => p.trim())
                .filter(p => p.length);
        }

        function renderScripture() {
            scriptureEl.innerHTML = '';
            paragraphs().forEach(text => {
                const p = document.createElement('p');
                // collapse single newlines within a paragraph to spaces
                p.innerHTML = text.replace(/\s*\n\s*/g, ' ');
                scriptureEl.appendChild(p);
            });
        }

        function renderNotes() {
            notesEl.innerHTML = '';
            const paras = scriptureEl.querySelectorAll('p');
            const bodyTop = pageBodyEl.getBoundingClientRect().top;

            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'handwritten-note';
                div.textContent = note.text;

                const target = paras[note.para] || paras[paras.length - 1];
                if (target) {
                    const y = target.getBoundingClientRect().top - bodyTop + (note.nudge || 0);
                    div.style.top = y + 'px';
                } else {
                    div.style.top = (note.nudge || 0) + 'px';
                }
                notesEl.appendChild(div);
            });
        }

        // How far the content runs past the point where clipped text would
        // collide with the footer. Negative / near-zero means it fits.
        function overflowPx() {
            const limit = limitEl.getBoundingClientRect().top - pageBodyEl.getBoundingClientRect().top;
            return pageBodyEl.getBoundingClientRect().height - limit;
        }

        function checkFit() {
            const over = Math.round(overflowPx());

            if (over > 2) {
                const lineHeight = parseFloat(getComputedStyle(scriptureEl).lineHeight) || 30;
                const lines = Math.max(1, Math.round(over / lineHeight));
                fitStatus.className = 'warn';
                fitStatus.textContent = '⚠ ' + over + 'px hidden at the foot — about ' + lines +
                    (lines === 1 ? ' line' : ' lines') + ' cut off. Trim the passage or lower the text size.';
            } else {
                fitStatus.className = '';
                fitStatus.textContent = 'Fits — nothing hidden.';
            }
        }

        function setSize(val) {
            val = Math.max(80, Math.min(150, parseInt(val, 10)));
            sizeInput.value = val;
            sizeReadout.textContent = (val / 100).toFixed(2);
            document.documentElement.style.setProperty('--scripture-size', (val / 100).toFixed(2) + 'rem');
        }

        // Opt-in only: the default is to hide overflow, never to shrink
        // automatically. Paragraph-anchored notes are re-placed after reflow.
        function fitToPage() {
            let val = parseInt(sizeInput.value, 10);
            let guard = 0;
            setSize(val);
            while (overflowPx() > 2 && val > 80 && guard < 40) {
                val -= 5;
                setSize(val);
                guard++;
            }
            renderNotes();
            checkFit();
        }

        function resetSize() {
            setSize(135);
            renderNotes();
            checkFit();
        }

        function updateSize(val) {
            setSize(val);
            renderNotes();
            checkFit();
        }

        function updatePreview() {
            renderScripture();
            pageRefEl.textContent = referenceInput.value;
            renderNotes();
            checkFit();
        }

        function renderNoteEditor() {
            const paras = paragraphs();
            notesList.innerHTML = '';
            notes.forEach((note, index) => {
                const item = document.createElement('div');
                item.className = 'note-item';

                const options = paras.map((p, i) => {
                    const snippet = p.replace(/<[^>]+>/g, '').slice(0, 34);
                    return '<option value="' + i + '"' + (i === note.para ? ' selected' : '') + '>' +
                           (i + 1) + '. ' + snippet + '…</option>';
                }).join('');

                item.innerHTML =
                    '<button class="remove-btn" onclick="removeNote(' + index + ')">✕</button>' +
                    '<textarea oninput="updateNoteText(' + index + ', this.value)">' + note.text + '</textarea>' +
                    '<div class="row"><label>Beside</label><select onchange="updateNotePara(' + index + ', this.value)">' + options + '</select></div>' +
                    '<div class="row"><label>Nudge</label><input type="range" min="-60" max="320" value="' + (note.nudge || 0) + '" oninput="updateNoteNudge(' + index + ', this.value)"></div>';
                notesList.appendChild(item);
            });
        }

        function refresh() {
            renderNoteEditor();
            updatePreview();
        }

        function addNote() {
            const paras = paragraphs();
            notes.push({ text: "New marginal note…", para: Math.min(notes.length, Math.max(0, paras.length - 1)), nudge: -6 });
            refresh();
        }

        function removeNote(index) { notes.splice(index, 1); refresh(); }
        function updateNoteText(index, val) { notes[index].text = val; updatePreview(); }
        function updateNotePara(index, val) { notes[index].para = parseInt(val, 10); updatePreview(); }
        function updateNoteNudge(index, val) { notes[index].nudge = parseInt(val, 10); updatePreview(); }

        function updateSize(val) {
            const rem = (val / 100).toFixed(2);
            document.documentElement.style.setProperty('--scripture-size', rem + 'rem');
            sizeReadout.textContent = rem;
            setTimeout(checkFit, 0);
        }

        async function exportImage() {
            const btn = document.querySelector('.btn-primary');
            const original = btn.textContent;
            btn.textContent = 'Generating…';
            btn.disabled = true;

            try {
                const canvas = await html2canvas(pageEl, {
                    scale: 3,
                    width: 1000,
                    height: 1000,
                    backgroundColor: '#fdfcf8',
                    logging: false,
                    useCORS: true
                });

                const slug = (referenceInput.value || 'passage').replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
                const link = document.createElement('a');
                link.download = 'bible-journal-' + slug + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('Export failed: ' + err.message);
            } finally {
                btn.textContent = original;
                btn.disabled = false;
            }
        }

        scriptureInput.addEventListener('input', refresh);
        referenceInput.addEventListener('input', updatePreview);
        sizeInput.addEventListener('input', function () { updateSize(this.value); });

        window.addEventListener('resize', updatePreview);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(updatePreview);
        }

        refresh();
        updateSize(sizeInput.value);
    </script>
</body>
</html>
