/* ── Google Fonts ── */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,800&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700;1,800&family=Caveat:wght@400;600&display=swap');

/* =================================================================
   CAROUSEL SLIDE TEMPLATES — templates.css
   ================================================================= */
.slide{
  --slide-w: 540px;
  --slide-h: 540px;
  width: var(--slide-w);
  height: var(--slide-h);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-feature-settings: "kern" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}
.slide.portrait{ --slide-h: 675px; }
.slide em{ font-style: inherit; }

/* JP-EDITORIAL */
.jpe{ --bg:#ffffff;--fg:#2c3d50;--fg-soft:#5a6877;--accent:#dfb81f;--link:#8b7417;--rule:#e8e8e8;--muted:#aaa;background:var(--bg);color:var(--fg);font-family:'Open Sans',sans-serif;padding:44px; }
.jpe.dark{ --bg:#2c3d50;--fg:#ffffff;--fg-soft:rgba(255,255,255,0.72);--link:var(--accent);--rule:rgba(255,255,255,0.12);--muted:rgba(255,255,255,0.35); }
.jpe.gold-bg{ --bg:#dfb81f;--fg:#2c3d50;--fg-soft:rgba(44,61,80,0.72);--link:#2c3d50;--accent:#2c3d50;--rule:rgba(44,61,80,0.18);--muted:rgba(44,61,80,0.4); }
.jpe-rule{ width:48px;height:3px;background:var(--accent); }
.jpe-eyebrow{ font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--link);white-space:nowrap; }
.jpe-h1{ font-size:52px;font-weight:800;font-style:italic;line-height:1.04;color:var(--fg);letter-spacing:-0.5px; }
.jpe.portrait .jpe-h1{ font-size:62px; }
.jpe-h1 em{ color:var(--accent); }
.jpe.gold-bg .jpe-h1 em{ color:#ffffff; }
.jpe-h2{ font-size:38px;font-weight:800;font-style:italic;line-height:1.1;color:var(--fg);letter-spacing:-0.3px; }
.jpe.portrait .jpe-h2{ font-size:46px; }
.jpe-h2 em{ color:var(--link); }
.jpe.dark .jpe-h2 em{ color:var(--accent); }
.jpe-body{ font-size:16px;line-height:1.65;color:var(--fg-soft); }
.jpe.portrait .jpe-body{ font-size:18px; }
.jpe-sub{ font-size:18px;line-height:1.5;color:var(--fg-soft); }
.jpe.portrait .jpe-sub{ font-size:21px; }
.jpe-footer{ display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:auto;padding-top:16px;border-top:1px solid var(--rule); }
.jpe-footer .handle{ color:var(--link);letter-spacing:1px;font-weight:600; }
.jpe-logo{ height:28px; }
.jpe.dark .jpe-logo{ filter:brightness(0) invert(1) opacity(0.75); }
.jpe-watermark-num{ position:absolute;font-size:220px;font-weight:800;font-style:italic;color:var(--fg);opacity:0.05;line-height:0.8;right:32px;top:24px;pointer-events:none; }
.jpe.dark .jpe-watermark-num{ color:var(--accent);opacity:0.18; }
.jpe-cover{ justify-content:space-between; }
.jpe-cover .top{ display:flex;align-items:center;justify-content:space-between; }
.jpe-stat{ justify-content:center;gap:20px; }
.jpe-stat .number{ font-size:180px;font-weight:800;font-style:italic;line-height:0.9;color:var(--accent);letter-spacing:-4px; }
.jpe.portrait .jpe-stat .number{ font-size:220px; }
.jpe-stat .label{ font-size:24px;font-weight:700;font-style:italic;color:var(--fg);line-height:1.2; }
.jpe.portrait .jpe-stat .label{ font-size:30px; }
.jpe-tip{ justify-content:space-between; }
.jpe-tip .body-block{ flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center; }
.jpe-tip .step{ font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--link); }
.jpe-list{ justify-content:space-between; }
.jpe-list ul{ list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:12px; }
.jpe-list li{ display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.5;color:var(--fg-soft); }
.jpe-list li::before{ content:'';width:8px;height:8px;background:var(--accent);border-radius:50%;flex-shrink:0;margin-top:8px; }
.jpe.portrait .jpe-list li{ font-size:19px; }
.jpe-quote{ justify-content:center;gap:24px;padding:56px 48px; }
.jpe-quote .qmark{ font-family:Georgia,serif;font-size:140px;font-style:italic;color:var(--accent);line-height:0.6;opacity:0.65; }
.jpe-quote .qtext{ font-size:26px;font-weight:700;font-style:italic;line-height:1.4;color:var(--fg); }
.jpe.portrait .jpe-quote .qtext{ font-size:32px; }
.jpe-quote .qattr{ font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--link);font-weight:600; }
.jpe-compare{ padding:36px 36px;gap:16px; }
.jpe-compare .compare-head{ font-size:22px;font-weight:800;font-style:italic;color:var(--fg);line-height:1.15;margin-bottom:8px; }
.jpe-compare .cols{ display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1; }
.jpe-compare .col{ padding:22px 20px;display:flex;flex-direction:column;gap:10px; }
.jpe-compare .col.dont{ background:#f5f0e3;border-left:4px solid #c8836b; }
.jpe-compare .col.do{ background:#2c3d50;color:#fff;border-left:4px solid var(--accent); }
.jpe-compare .col h3{ font-size:13px;font-weight:800;font-style:italic;letter-spacing:1.5px;text-transform:uppercase; }
.jpe-compare .col.dont h3{ color:#a85939; }
.jpe-compare .col.do h3{ color:var(--accent); }
.jpe-compare .col p{ font-size:14px;line-height:1.5; }
.jpe-compare .col.dont p{ color:#5a4a3d; }
.jpe-compare .col.do p{ color:rgba(255,255,255,0.85); }
.jpe.portrait .jpe-compare .col p{ font-size:16px; }
.jpe-case{ padding:40px 40px;gap:14px;justify-content:space-between; }
.jpe-case .row{ display:grid;grid-template-columns:100px 1fr;align-items:start;gap:18px;padding:14px 0;border-bottom:1px solid var(--rule); }
.jpe-case .row:last-of-type{ border-bottom:0; }
.jpe-case .row .label{ font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--link);padding-top:4px; }
.jpe-case .row .content h4{ font-size:18px;font-weight:800;font-style:italic;color:var(--fg);margin-bottom:4px; }
.jpe-case .row .content p{ font-size:13px;line-height:1.55;color:var(--fg-soft); }
.jpe-image{ padding:0; }
.jpe-image .image-slot{ height:60%;background:var(--rule);position:relative;overflow:hidden; }
.jpe-image .image-slot .placeholder{ position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,#dfd9c8,#e8e2d0); }
.jpe-image .caption-block{ padding:28px 40px;flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center; }
.jpe-image .caption-block .eyebrow{ font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--link);font-weight:700; }
.jpe-image .caption-block h2{ font-size:26px;font-weight:800;font-style:italic;color:var(--fg);line-height:1.15; }
.jpe-image .caption-block p{ font-size:14px;color:var(--fg-soft);line-height:1.5; }
.jpe.portrait .jpe-image .image-slot{ height:55%; }
.jpe-author{ flex-direction:row;padding:0; }
.jpe-author .photo-side{ width:45%;height:100%;background:linear-gradient(135deg,#dfd9c8,#bfb593);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(44,61,80,0.4);font-size:11px;letter-spacing:1.5px;text-transform:uppercase; }
.jpe-author .text-side{ flex:1;padding:36px 32px;display:flex;flex-direction:column;gap:12px;justify-content:center; }
.jpe-author .role{ font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--link);font-weight:700; }
.jpe-author .name{ font-size:36px;font-weight:800;font-style:italic;color:var(--fg);line-height:1.05;letter-spacing:-0.5px; }
.jpe-author .bio{ font-size:14px;color:var(--fg-soft);line-height:1.6; }
.jpe-author .handles{ display:flex;gap:14px;font-size:11px;color:var(--link);font-weight:600;letter-spacing:0.5px;margin-top:auto; }
.jpe-cta{ justify-content:center;gap:22px;padding:52px 48px; }
.jpe-cta .pill{ display:inline-block;align-self:flex-start;background:var(--accent);color:#2c3d50;font-size:13px;font-weight:800;padding:12px 22px;border-radius:28px;letter-spacing:0.4px; }
.jpe-cta .pill.outline{ background:transparent;color:var(--accent);border:2px solid var(--accent); }

/* JP-MAGAZINE */
.jpm{ --bg:#15202c;--fg:#f4eedb;--fg-soft:rgba(244,238,219,0.7);--accent:#dfb81f;--accent-2:#d6a44c;--rule:rgba(244,238,219,0.15);background:var(--bg);color:var(--fg);font-family:'Open Sans',sans-serif;padding:36px 40px; }
.jpm.cream{ --bg:#f4eedb;--fg:#2c3d50;--fg-soft:rgba(44,61,80,0.7);--accent:#8b7417;--rule:rgba(44,61,80,0.15); }
.jpm.midnight{ --bg:#0d1620;--fg:#f4eedb;--accent:#dfb81f; }
.jpm-chrome{ display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--fg-soft);letter-spacing:0.5px; }
.jpm-chrome .pg{ font-weight:600; }
.jpm-chrome .badge{ border:1px solid var(--rule);padding:3px 12px;border-radius:20px; }
.jpm-footer{ display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px; }

.jpm-h1{ font-family:'Open Sans';font-style:italic;font-weight:800;line-height:0.98;letter-spacing:-1.5px;font-size:72px;color:var(--fg); }
.jpm.portrait .jpm-h1{ font-size:92px; }
.jpm-h1 .gold{ color:var(--accent); }

.jpm-h2{ font-family:'Open Sans';font-style:italic;font-weight:800;line-height:1;letter-spacing:-1px;font-size:52px;color:var(--accent); }
.jpm.portrait .jpm-h2{ font-size:68px; }
.jpm-script{ font-family:'Caveat',cursive;font-size:22px;color:var(--fg);transform:rotate(-6deg);display:inline-block; }
.jpm-arrow{ font-family:'Caveat',cursive;font-size:36px;color:var(--accent); }
.jpm-body{ font-size:14px;line-height:1.6;color:var(--fg-soft); }
.jpm.portrait .jpm-body{ font-size:16px; }
.jpm-photo{ background:linear-gradient(135deg,#3a4858,#1d2935);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:2px;text-transform:uppercase; }

.jpm-stat{ justify-content:center;align-items:center;text-align:center;gap:20px; }
.jpm-stat .num{ font-family:'Open Sans';font-style:italic;font-weight:800;font-size:280px;color:var(--accent);line-height:0.82;letter-spacing:-8px; }
.jpm.portrait .jpm-stat .num{ font-size:340px; }
.jpm-stat .label{ font-size:22px;font-weight:700;font-style:italic;color:var(--fg);max-width:80%;line-height:1.25; }
.jpm-stat .sub{ font-size:14px;color:var(--fg-soft);max-width:70%;line-height:1.5; }
.jpm-tip{ gap:0;padding:0; }
.jpm-tip .chrome-strip{ padding:24px 36px 12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--fg-soft); }
.jpm-tip .grid{ flex:1;display:grid;grid-template-columns:1fr 1fr; }
.jpm-tip .photo{ background:linear-gradient(135deg,#3a4858,#1d2935);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:24px;color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:2px; }

.jpm-list ul{ list-style:none;padding:0;display:flex;flex-direction:column;gap:14px; }
.jpm-list li{ display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:baseline;font-size:15px;line-height:1.4;color:var(--fg);border-top:1px solid var(--rule);padding-top:12px; }
.jpm-list li:first-child{ border-top:0;padding-top:0; }
.jpm-list li .n{ font-style:italic;font-weight:800;font-size:28px;color:var(--accent);letter-spacing:-1px; }
.jpm-quote{ justify-content:center;gap:24px;padding:56px 48px;position:relative; }

/* HEA-CLEAN */
.hec{ --bg:#ffffff;--ink:#3D2A35;--ink-soft:#6f5d68;--purple:#9E41BF;--purple-soft:#F3E8F8;--purple-mid:#AF81BF;--rule:#f0e6f5;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;padding:40px; }
.hec.cyan{ --purple:#0a9abf;--purple-soft:#E6F9FD;--purple-mid:#5cc7e0; }
.hec.green{ --purple:#17a032;--purple-soft:#E8F8EC;--purple-mid:#6dc97f; }
.hec.dark{ --bg:#3D2A35;--ink:#ffffff;--ink-soft:rgba(255,255,255,0.78);--rule:rgba(255,255,255,0.12);--purple-soft:rgba(255,255,255,0.08); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --ui-bg:#0f0f10;--ui-surface:#1a1a1c;--ui-surface-2:#232326;--ui-border:#2a2a2e;
  --ui-text:#e6e6e8;--ui-muted:#888892;--ui-faint:#5a5a62;

html,body{ height:100%; }
body{ font-family:'Inter','Open Sans',sans-serif;background:var(--ui-bg);color:var(--ui-text);display:flex;height:100vh;overflow:hidden;font-size:13px; }

::-webkit-scrollbar{ width:8px;height:8px; }
::-webkit-scrollbar-track{ background:transparent; }

::-webkit-scrollbar-thumb:hover{ background:#3a3a3e; }

#toast.show{ opacity:1; }
#slide-info{ font-size:11px;color:var(--ui-muted); }
</style>
</head>

<script>
/* =================================================================
   CAROUSEL TEMPLATES — templates.js (asset paths → raw GitHub URLs)
   ================================================================= */
(function(){
'use strict';
const ASSETS = 'https://raw.githubusercontent.com/jonathanpay/carousel-maker/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const acc = (s, color) => { const style = color ? ` style="color:${color}"` : ''; return esc(s ?? '').replace(/\*(.+?)\*/g, `<em${style}>$1</em>`); };
const lineBreak = s => esc(s ?? '').replace(/\n/g, '<br>');
const accBR = (s, color) => { const style = color ? ` style="color:${color}"` : ''; return esc(s ?? '').replace(/\*(.+?)\*/g, `<em${style}>$1</em>`).replace(/\n/g, '<br>'); };
const iconSrc = key => (!key || key === 'none') ? null : ASSETS + 'assets/icons/' + key;
const fmtSlide = (slide) => slide.format === 'portrait' ? 'portrait' : '';

const FAMILIES = {
  'jp-editorial': { brand:'jp', label:'JP — Editorial', subtitle:'Refined navy + gold', themes:['navy','white','gold'] },
  'jp-magazine':  { brand:'jp', label:'JP — Magazine',  subtitle:'Luxe oversized italic', themes:['navy','cream','midnight'] },
  'hea-clean':    { brand:'hea',label:'HEA — Clean',    subtitle:'Bright purple, polished', themes:['purple','cyan','green','dark'] },
  'hea-shapes':   { brand:'hea',label:'HEA — Shapes',   subtitle:'Dark + geometric blocks', themes:['purple','cyan','green','plum'] },
};

const LAYOUTS = ['cover','stat','tip','list','quote','compare','case','image','author','cta'];
const LAYOUT_LABELS = { cover:'Cover',stat:'Big Stat',tip:'Numbered Tip',list:'Checklist',quote:'Pull Quote',compare:'Compare',case:'Case Study',image:'Image + Caption',author:'Author',cta:'CTA' };

const FIELDS = {
  cover:   [ {id:'eyebrow',label:'Eyebrow / Tag',ph:'Email Strategy'}, {id:'headline',label:'Headline (use *word* for accent)',ph:'5 *tips* to write better emails',ta:true}, {id:'sub',label:'Subheadline',ph:'A practical guide for marketers who actually want to grow.',ta:true} ],
  stat:    [ {id:'number',label:'Big number',ph:'73%'}, {id:'label',label:'What it means',ph:'of emails get deleted in under 3 seconds',ta:true}, {id:'body',label:'Supporting context',ph:"Your subject line is the door. If it doesn't open, nothing else matters.",ta:true} ],
  tip:     [ {id:'step',label:'Step / Tip number',ph:'01'}, {id:'kicker',label:'Kicker (small label)',ph:'TIP ONE'}, {id:'headline',label:'Headline',ph:'Write *subject lines* that get opened',ta:true}, {id:'body',label:'Body',ph:'Front-load value, drop the cleverness, and keep it under 50 characters.',ta:true} ],
  list:    [ {id:'headline',label:'Headline',ph:'5 things *every* email needs',ta:true}, {id:'sub',label:'Subheadline',ph:'A quick checklist before you hit send.'}, {id:'item1',label:'Item 1',ph:'A subject line that earns the open'}, {id:'item2',label:'Item 2',ph:'A single, clear goal per send'}, {id:'item3',label:'Item 3',ph:"Copy that respects their time"}, {id:'item4',label:'Item 4',ph:'A CTA that actually makes sense'}, {id:'item5',label:'Item 5 (optional)',ph:'A reason to keep subscribing'}, {id:'item6',label:'Item 6 (optional)',ph:''} ],
  quote:   [ {id:'quote',label:'Quote',ph:"The best email you'll ever send is the one your subscriber actually asked for.",ta:true}, {id:'attr',label:'Attribution',ph:'— Jonathan Pay'} ],
  compare: [ {id:'headline',label:'Headline',ph:'Stop doing *this*. Try this instead.',ta:true}, {id:'dontTitle',label:"Don't — title",ph:"Don't"}, {id:'dontBody',label:"Don't — body",ph:'Sending the same template to every segment and hoping for the best.',ta:true}, {id:'doTitle',label:'Do — title',ph:'Do'}, {id:'doBody',label:'Do — body',ph:'Match the message to the behaviour. Trigger > broadcast every time.',ta:true} ],
  case:    [ {id:'headline',label:'Headline',ph:'How one tweak doubled the *click-through*',ta:true}, {id:'p1',label:'Problem',ph:'Open rates were strong but nobody was clicking through.'}, {id:'p2',label:'Fix',ph:'Cut the body in half and led with a single, specific CTA.'}, {id:'p3',label:'Result',ph:'CTR jumped from 1.8% to 4.1% within two weeks.'} ],
  image:   [ {id:'eyebrow',label:'Category / Eyebrow',ph:'Behind the Send'}, {id:'headline',label:'Headline',ph:'What I learned shipping 400 emails',ta:true}, {id:'body',label:'Caption / body',ph:"Some patterns only show up at volume. Here's what I noticed.",ta:true}, {id:'photoUrl',label:'Photo URL (optional)',ph:'paste image URL or leave blank for placeholder'} ],
  author:  [ {id:'role',label:'Role / kicker',ph:'About the author'}, {id:'name',label:'Name',ph:'Jonathan Pay'}, {id:'bio',label:'Bio',ph:"Email marketer, writer, second-generation ESP brat. I've worked in email since before Gmail existed.",ta:true}, {id:'handles',label:'Handles / links (comma separated)',ph:'@jonathanpay, jonathanpay.com'}, {id:'photoUrl',label:'Photo URL (optional)',ph:'paste image URL'} ],
  cta:     [ {id:'pre',label:'Pre-headline',ph:'Want more like this?'}, {id:'headline',label:'Headline',ph:'Follow for *smarter* email tips',ta:true}, {id:'sub',label:'Body',ph:"Weekly notes on what's working in my inbox and what I'm testing next.",ta:true}, {id:'pill',label:'Button label',ph:'Follow →'} ],
};

const THEMES = {
  'jp-editorial': {
    navy:  { label:'Navy',  swatch:'#2c3d50', cls:{cover:'dark',cta:'dark',quote:'dark',tip:'',list:'',stat:'',compare:'',case:'',image:'',author:''} },
    white: { label:'White', swatch:'#ffffff', cls:{} },
    gold:  { label:'Gold',  swatch:'#dfb81f', cls:{cover:'gold-bg',cta:'gold-bg'} },
  },
  'jp-magazine': {
    navy:    { label:'Navy',  swatch:'#15202c', cls:{} },
    cream:   { label:'Cream', swatch:'#f4eedb', cls:{_all:'cream'} },
    midnight:{ label:'Black', swatch:'#0d1620', cls:{_all:'midnight'} },
  },
  'hea-clean': {
    purple: { label:'Purple', swatch:'#9E41BF', cls:{} },
    cyan:   { label:'Cyan',   swatch:'#22CEF2', cls:{_all:'cyan'} },
    green:  { label:'Green',  swatch:'#21BF3D', cls:{_all:'green'} },
    dark:   { label:'Plum',   swatch:'#3D2A35', cls:{_all:'dark'} },
  },
  'hea-shapes': {
    purple: { label:'Purple', swatch:'#9E41BF', cls:{} },
    cyan:   { label:'Cyan',   swatch:'#22CEF2', cls:{_all:'cyan'} },
    green:  { label:'Green',  swatch:'#21BF3D', cls:{_all:'green'} },
    plum:   { label:'Plum',   swatch:'#4a1f5c', cls:{_all:'purple-bg'} },
  },
};

const ICONS = ['email.png','growth.png','heart.png','brain.png','strategy.png','target.png','graduation.png','book.png','bolt.png','chart.png','compass.png','puzzle.png','teacher.png','badge.png','mind.png','shield.png','plan.png','notebook.png','design.png','handshake.png'];

function themeCls(family, theme, layout){ const t = THEMES[family]?.[theme]; if (!t||!t.cls) return ''; if (t.cls._all) return t.cls._all; return t.cls[layout]||''; }
function photoBlock(url, label){ if(url) return `<img src="${esc(url)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`; return `<span style="opacity:0.7">${esc(label||'PHOTO PLACEHOLDER')}</span>`; }

const JPE = {};
JPE.cover = (s,t,f) => { const d=s.fields||{}; return `<div class="slide jpe jpe-cover ${t} ${f}"><div class="top"><div class="jpe-eyebrow">${esc(d.eyebrow)}</div><img src="${ASSETS}assets/logos/jp-full.png" class="jpe-logo" alt="JP"></div><div style="display:flex;flex-direction:column;gap:18px"><div class="jpe-rule"></div><h1 class="jpe-h1">${acc(d.headline)}</h1>${d.sub?`<p class="jpe-sub">${lineBreak(d.sub)}</p>`:''}</div><div class="jpe-footer"><span class="handle">${esc(s.handle)}</span><span>${esc(s.pg)} / ${esc(s.pgTot)}</span></div></div>`; };
JPE.stat = (s,t,f) => { const d=s.fields||{}; return `<div class="slide jpe jpe-stat ${t} ${f}"><div class="jpe-rule"></div><div class="number">${esc(d.number)}</div><div class="label">${acc(d.label)}</div>${d.body?`<p class="jpe-body" style="margin-top:8px">${lineBreak(d.body)}</p>`:''}<div class="jpe-footer"><span class="handle">${esc(s.handle)}</span><span>${esc(s.pg)} / ${esc(s.pgTot)}</span></div></div>`; };

HES.cta = (s,t,f) => { const d=s.fields||{}; return `<div class="slide hes hes-cta ${t} ${f}"><div class="hes-shape tr-circle" style="opacity:0.85"></div><div class="pre">${esc(d.pre)}</div><h2>${acc(d.headline)}</h2>${d.sub?`<p>${lineBreak(d.sub)}</p>`:''}<div class="arrow-btn">→</div><div class="hes-footer" style="margin-top:auto"><span class="handle">${esc(s.handle)}</span><span>${esc(s.pg)} / ${esc(s.pgTot)}</span></div></div>`; };

function renderFields(){
  const slide = state.slides[state.currentIdx]; const defs = T.FIELDS[slide.layout]||[]; const wrap = $('#fields'); wrap.innerHTML='';

function buildTweaksPanel(){

  wrap.innerHTML=`<div class="tweak-section"><h3>Footer</h3><div class="toggle-row"><span>Show page numbers</span><div class="toggle ${state.tweaks.showPageNumbers?'on':''}" data-tweak="showPageNumbers"></div></div><div class="toggle-row"><span>Show handles</span><div class="toggle ${state.tweaks.showHandles?'on':''}" data-tweak="showHandles"></div></div></div><div class="tweak-section"><h3>Visual</h3><div class="toggle-row"><span>Watermark numbers (Tip slides)</span><div class="toggle ${state.tweaks.showWatermarkNum?'on':''}" data-tweak="showWatermarkNum"></div></div><div class="slider-row"><div class="lbl">Font scale <span class="val">${state.tweaks.fontScale}%</span></div><input type="range" min="80" max="130" step="5" value="${state.tweaks.fontScale}" data-tweak="fontScale"></div><div class="slider-row"><div class="lbl">Outer padding <span class="val">${state.tweaks.outerPadding}%</span></div><input type="range" min="60" max="140" step="5" value="${state.tweaks.outerPadding}" data-tweak="outerPadding"></div></div><div class="tweak-section"><h3>Apply</h3><button class="btn btn-ghost" onclick="window.__resetTweaks()" style="width:100%">Reset to defaults</button></div>`;

}

window.__resetTweaks = function(){ state.tweaks={...TWEAKS_DEFAULTS}; buildTweaksPanel(); applyTweaks(); };

function applyTweaks(){ document.documentElement.style.setProperty('--slide-font-scale',state.tweaks.fontScale/100); document.documentElement.style.setProperty('--slide-padding-scale',state.tweaks.outerPadding/100); renderCanvas(); renderTray(); }

function setFamily(key){ const slide=state.slides[state.currentIdx]; slide.family=key; slide.theme=Object.keys(T.THEMES[key])[0]; const brand=T.FAMILIES[key].brand; if(slide.handle===DEFAULT_HANDLE_JP||slide.handle===DEFAULT_HANDLE_HEA){ slide.handle=brand==='hea'?DEFAULT_HANDLE_HEA:DEFAULT_HANDLE_JP; $('#fld-handle').value=slide.handle; } if(brand==='jp') slide.icon='none'; reflectSidebar(); renderCanvas(); refreshThumb(state.currentIdx); }
function setLayout(layout){ const slide=state.slides[state.currentIdx]; slide.layout=layout; (T.FIELDS[layout]||[]).forEach(def=>{ if(slide.fields[def.id]===undefined) slide.fields[def.id]=/url$/i.test(def.id)?'':(def.ph||''); }); reflectSidebar(); renderCanvas(); refreshThumb(state.currentIdx); }
function setTheme(key){ const slide=state.slides[state.currentIdx]; slide.theme=key; reflectSidebar(); renderCanvas(); refreshThumb(state.currentIdx); }
function setIcon(key){ const slide=state.slides[state.currentIdx]; slide.icon=key; $$('.icon-opt').forEach(el=>el.classList.toggle('selected',el.dataset.icon===key)); renderCanvas(); refreshThumb(state.currentIdx); }

function reflectSidebar(){ const slide=state.slides[state.currentIdx]; $$('.family-card').forEach(b=>b.classList.toggle('active',b.dataset.family===slide.family)); $$('.layout-btn').forEach(b=>b.classList.toggle('active',b.dataset.layout===slide.layout)); buildThemePicker(); $$('.icon-opt').forEach(el=>el.classList.toggle('selected',el.dataset.icon===slide.icon)); const brand=T.FAMILIES[slide.family].brand; $('#icon-section').style.display=brand==='hea'?'':'none'; renderFields(); setupGlobals(); }
function loadCurrent(){ reflectSidebar(); }

function applyRenderTweaks(slide){ const s={...slide,fields:{...slide.fields}}; if(!state.tweaks.showPageNumbers){s.pg='';s.pgTot='';} if(!state.tweaks.showHandles){s.handle='';} return s; }

function updateCanvasSize(){ const area=$('#preview-area'); const slide=$('.slide'); if(!slide) return; const aw=area.clientWidth-48; const ah=area.clientHeight-48; const sw=slide.offsetWidth; const sh=slide.offsetHeight; const scale=Math.min(aw/sw,ah/sh,1.4); const wrap=$('#slide-canvas-wrap'); wrap.style.transform=`scale(${scale})`; wrap.style.transformOrigin='center'; }

function addSlide(opts){ const last=state.slides[state.slides.length-1]; const idx=state.slides.length+1; const newSlide=defaultsFor(opts?.family||last.family,opts?.layout||'tip',idx); newSlide.theme=opts?.theme||last.theme; newSlide.format=state.format; newSlide.handle=last.handle; state.slides.push(newSlide); state.currentIdx=state.slides.length-1; const total=String(state.slides.length).padStart(2,'0'); state.slides.forEach((s,i)=>{s.pgTot=total;if(!opts)s.pg=s.pg||String(i+1).padStart(2,'0');}); state.slides[state.currentIdx].pg=String(state.slides.length).padStart(2,'0'); loadCurrent(); renderTray(); renderCanvas(); }
function duplicateSlide(){ const slide=state.slides[state.currentIdx]; const copy=JSON.parse(JSON.stringify(slide)); copy.pg=String(state.slides.length+1).padStart(2,'0'); state.slides.splice(state.currentIdx+1,0,copy); const total=String(state.slides.length).padStart(2,'0'); state.slides.forEach(s=>s.pgTot=total); state.currentIdx=state.currentIdx+1; loadCurrent(); renderTray(); renderCanvas(); }

async function exportSlide(){ if(!window.html2canvas) return toast('Exporter loading…'); const wrap=$('#slide-canvas-wrap'); const prevTransform=wrap.style.transform; wrap.style.transform='scale(1)'; const slide=wrap.querySelector('.slide'); const w=slide.offsetWidth,h=slide.offsetHeight; const exportScale=1080/w; const canvas=await html2canvas(slide,{backgroundColor:null,scale:exportScale,width:w,height:h,useCORS:true,logging:false}); wrap.style.transform=prevTransform; const a=document.createElement('a'); a.download=`carousel-${String(state.currentIdx+1).padStart(2,'0')}.png`; a.href=canvas.toDataURL('image/png'); a.click(); toast('PNG downloaded'); }
async function exportAll(){ if(!window.html2canvas) return toast('Exporter loading…'); toast('Exporting all slides…'); const origIdx=state.currentIdx; for(let i=0;i<state.slides.length;i++){ state.currentIdx=i; renderCanvas(); await new Promise(r=>setTimeout(r,100)); const wrap=$('#slide-canvas-wrap'); const prevTransform=wrap.style.transform; wrap.style.transform='scale(1)'; const slide=wrap.querySelector('.slide'); const w=slide.offsetWidth,h=slide.offsetHeight; const canvas=await html2canvas(slide,{backgroundColor:null,scale:1080/w,width:w,height:h,useCORS:true,logging:false}); wrap.style.transform=prevTransform; const a=document.createElement('a'); a.download=`carousel-${String(i+1).padStart(2,'0')}.png`; a.href=canvas.toDataURL('image/png'); a.click(); await new Promise(r=>setTimeout(r,250)); } state.currentIdx=origIdx; renderCanvas(); toast('All slides exported'); }

function setupShowcase(){ const body=$('#showcase-body'); body.innerHTML=''; const sampleFor=(family,layout)=>{ const s=defaultsFor(family,layout,1); s.pgTot='06'; s.format=state.format; return s; }; Object.entries(T.FAMILIES).forEach(([famKey,fam])=>{ const row=document.createElement('div'); row.className='show-row'; row.innerHTML=`<h3>${fam.label}</h3><div class="row-sub">${fam.subtitle}</div><div class="show-grid"></div>`; const grid=row.querySelector('.show-grid'); T.LAYOUTS.forEach(layout=>{ const card=document.createElement('div'); card.className='show-card'; const sample=sampleFor(famKey,layout); const themes=Object.keys(T.THEMES[famKey]); if(layout==='quote'&&themes.length>1) sample.theme=themes[1]||themes[0]; card.innerHTML=`<div class="card-preview"><div class="preview-inner"></div></div><div class="card-label">${T.LAYOUT_LABELS[layout]}</div><div class="card-meta">${fam.label.split(' — ')[1]||fam.label}</div>`; card.querySelector('.preview-inner').innerHTML=T.render(sample); const cardEl=card.querySelector('.card-preview'); requestAnimationFrame(()=>{ const w=cardEl.clientWidth||196; const slideW=540,slideH=state.format==='portrait'?675:540; const scale=w/slideW; const inner=card.querySelector('.preview-inner'); inner.style.transform=`scale(${scale})`; inner.style.width=slideW+'px'; inner.style.height=slideH+'px'; cardEl.style.aspectRatio=state.format==='portrait'?'4 / 5':'1'; }); card.onclick=()=>{ addSlide({family:famKey,layout,theme:sample.theme}); closeShowcase(); }; grid.appendChild(card); }); body.appendChild(row); }); }
function openShowcase(){ setupShowcase(); $('#showcase').classList.add('open'); }
function closeShowcase(){ $('#showcase').classList.remove('open'); }

function setupEditMode(){ window.addEventListener('message',(e)=>{ if(e.data?.type==='__activate_edit_mode') $('#tweaks').classList.add('open'); if(e.data?.type==='__deactivate_edit_mode') $('#tweaks').classList.remove('open'); }); }

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

window.addEventListener('DOMContentLoaded',()=>{
  init();
  $('#btn-duplicate').onclick=duplicateSlide;
  $('#btn-export').onclick=exportSlide;
  $('#btn-export-all').onclick=exportAll;
  $('#btn-browse').onclick=openShowcase;
  $('#btn-tweaks').onclick=()=>$('#tweaks').classList.toggle('open');
  $('#close-showcase').onclick=closeShowcase;
  $('#close-tweaks').onclick=()=>$('#tweaks').classList.remove('open');
  $$('.format-toggle button').forEach(b=>{ b.onclick=()=>setFormat(b.dataset.fmt); });
  setTimeout(()=>{ reflectSidebar(); renderCanvas(); renderTray(); },50);
  window.addEventListener('resize',updateCanvasSize);
});

window.__state = state;
})();
</script>
