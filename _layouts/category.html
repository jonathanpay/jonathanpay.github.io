---
layout: default
---
<div class="jp-blog-head">
  <h1 class="jp-blog-title"><span class="jp-section-h-text">{{ page.category }}</span><span class="jp-section-slash"> /</span></h1>
  {% if page.dek %}<p class="jp-blog-dek">{{ page.dek }}</p>{% endif %}
  <p class="jp-back-line"><a class="jp-back" href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
</div>

<div class="jp-image-card-grid jp-writing-grid">
  {% assign cat_posts = site.categories[page.category] | sort: "date" | reverse %}
  {% for post in cat_posts %}
    {% include writing-card.html post=post %}
  {% endfor %}
</div>
