<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en-GB' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    {% seo title=false %}
  </head>
  <body>
    <header class="jp-header{% if page.layout == 'home' %} jp-header--overlay{% endif %}">
      <div class="jp-header-inner">
        <a class="jp-brand" href="{{ '/' | relative_url }}">
          <span class="jp-brand-mark" role="img" aria-label="Jonathan Pay"></span>
        </a>
        <button class="jp-nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
          <span class="jp-nav-toggle-bar"></span>
          <span class="jp-nav-toggle-bar"></span>
          <span class="jp-nav-toggle-bar"></span>
        </button>
        <nav class="jp-nav" id="primary-nav" aria-label="Primary navigation">
          <a class="jp-nav-link{% if page.url == '/blog/' %} is-active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a>
          <a class="jp-nav-link{% if page.url == '/holistic-email-marketing/' %} is-active{% endif %}" href="{{ '/holistic-email-marketing/' | relative_url }}">Holistic Email Marketing</a>
          <a class="jp-nav-link{% if page.url == '/holistic-email-academy/' %} is-active{% endif %}" href="{{ '/holistic-email-academy/' | relative_url }}">Holistic Email Academy</a>
        </nav>
      </div>
    </header>

    <script>
      (function () {
        var toggle = document.querySelector(".jp-nav-toggle");
        var nav = document.getElementById("primary-nav");
        if (!toggle || !nav) return;

        toggle.addEventListener("click", function () {
          var isOpen = nav.classList.toggle("is-open");
          toggle.classList.toggle("is-open", isOpen);
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        nav.addEventListener("click", function (e) {
          if (e.target.closest("a")) {
            nav.classList.remove("is-open");
            toggle.classList.remove("is-open");
            toggle.setAttribute("aria-expanded", "false");
          }
        });
      })();
    </script>

    <main class="jp-main">
      {{ content }}
    </main>

    <footer class="jp-footer on-dark">
      <div class="jp-footer-inner">
        <div class="jp-footer-left">
          <span class="jp-footer-mark" role="img" aria-label="JP"></span>
          <div class="jp-footer-tagline">Email marketer. Writer. Weston-super-Mare.</div>
        </div>
        <div class="jp-footer-right">
          <div class="jp-social-row">
            <a href="https://bsky.app/profile/jonathanpay.bsky.social" target="_blank" rel="noopener" aria-label="Bluesky">Bluesky</a>
            <a href="https://www.linkedin.com/in/jonathanpay/" target="_blank" rel="noopener" aria-label="LinkedIn">LinkedIn</a>
            <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS">RSS</a>
          </div>
          <div class="jp-copy">&copy; {{ 'now' | date: '%Y' }} Jonathan Pay. <a href="{{ '/privacy-policy/' | relative_url }}">Privacy policy</a>.</div>
        </div>
      </div>
    </footer>
  </body>
</html>
