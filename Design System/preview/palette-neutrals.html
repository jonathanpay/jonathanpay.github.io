<!doctype html>
<!-- @dsCard group="Colors" name="Palette — neutrals" subtitle="Black body, mid grey meta, light grey rules" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Palette — neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .swatch { border: 1px solid var(--jp-light-grey); display: flex; flex-direction: column; }
  .chip { height: 86px; }
  .meta { padding: 10px 12px 12px; }
  .name { font-style: italic; font-weight: 700; font-size: 14px; color: var(--jp-black); margin: 0 0 2px; }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--jp-mid-grey); letter-spacing: 0.04em; text-transform: uppercase; }
  .role { font-size: 11px; color: var(--jp-mid-grey); margin-top: 4px; line-height: 1.45; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background: var(--jp-black);"></div>
      <div class="meta">
        <div class="name">Black</div>
        <div class="hex">#000000</div>
        <div class="role">Primary body text. No softening.</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--jp-mid-grey);"></div>
      <div class="meta">
        <div class="name">Mid Grey</div>
        <div class="hex">#6d6d6d</div>
        <div class="role">Meta, captions, secondary</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--jp-light-grey);"></div>
      <div class="meta">
        <div class="name">Light Grey</div>
        <div class="hex">#dbdbdb</div>
        <div class="role">Rules, subtle backgrounds</div>
      </div>
    </div>
  </div>
</body>
</html>
