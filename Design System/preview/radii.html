<!doctype html>
<!-- @dsCard group="Spacing" name="Radii — sharp by default" subtitle="0px almost everywhere" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Radii — sharp by default</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 26px; background: #fff; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell { border: 1px solid var(--jp-light-grey); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 72px; height: 56px; background: var(--jp-navy); }
  .box.r1 { border-radius: 2px; }
  .box.pill { border-radius: 999px; width: 110px; height: 36px; }
  .name { font-style: italic; font-weight: 700; font-size: 13px; color: var(--jp-black); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--jp-mid-grey); }
  .note { margin-top: 16px; color: var(--jp-mid-grey); font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="box"></div><div class="name">radius-0</div><div class="val">0px — default</div></div>
    <div class="cell"><div class="box r1"></div><div class="name">radius-1</div><div class="val">2px — inputs only</div></div>
    <div class="cell"><div class="box pill"></div><div class="name">radius-pill</div><div class="val">999px — chips only</div></div>
  </div>
  <p class="note">Sharp corners almost everywhere. The system intentionally avoids the soft-rounded SaaS look.</p>
</body>
</html>
