<!doctype html>
<!-- @dsCard group="Components" name="Post card" subtitle="Meta line, italic title, body" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Post card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 26px; background: #fff; }
  .card { border: 1px solid var(--jp-light-grey); padding: 22px 24px; max-width: 620px; }
  .meta { font-size: 13px; color: var(--jp-mid-grey); letter-spacing: 0.04em; margin-bottom: 8px; }
  .meta a { color: var(--jp-link-gold); font-style: italic; font-weight: 700; text-decoration: none; }
  h2 { margin: 0 0 8px; font-size: 24px; font-weight: 700; font-style: italic; line-height: 1.2; color: var(--jp-black); }
  h2 a { color: inherit; text-decoration: none; }
  p { margin: 0; font-size: 17px; line-height: 1.6; color: var(--jp-black); }
</style>
</head>
<body>
  <article class="card">
    <div class="meta"><a href="#">Work</a> &middot; 21 May 2026</div>
    <h2><a href="#">The world's first second-generation email marketer</a></h2>
    <p>My mum ran one of Australia's first email service providers. I've worked in email since before Gmail existed. Literally. The obituaries keep getting written. The channel keeps living.</p>
  </article>
</body>
</html>
