<!doctype html>
<!-- @dsCard group="Components" name="Pull-quote" subtitle="3px gold rule, italic, optional cite" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pull-quote</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 28px; background: #fff; }
  blockquote {
    border-left: 3px solid var(--jp-highlight-gold);
    margin: 0;
    padding: 6px 0 6px 22px;
    font-style: italic;
    font-size: 22px;
    line-height: 1.5;
    color: var(--jp-black);
    max-width: 620px;
  }
  cite {
    display: block;
    font-style: normal;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--jp-mid-grey);
    margin-top: 12px;
  }
</style>
</head>
<body>
  <blockquote>
    LLMs don't think. They predict. That distinction matters more than most people realise.
    <cite>— Bluesky, March 2026</cite>
  </blockquote>
</body>
</html>
